version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apiquota_db
    restart: always
    environment:
      POSTGRES_USER: apiquota
      POSTGRES_PASSWORD: apiquota_secret_password
      POSTGRES_DB: apiquota
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiquota -d apiquota"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
